<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Open AI Educator</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --primary: #3b82f6; --text: #f8fafc; --muted: #94a3b8; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--panel); padding: 1rem; text-align: center; font-size: 1.1rem; font-weight: 600; border-bottom: 1px solid #334155; }
        #chat { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; max-width: 700px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .msg { padding: 0.8rem 1rem; border-radius: 1rem; max-width: 85%; line-height: 1.4; word-break: break-word; }
        .user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 0.2rem; }
        .ai { background: var(--panel); color: var(--text); align-self: flex-start; border-bottom-left-radius: 0.2rem; border: 1px solid #334155; }
        .controls { background: var(--panel); padding: 1rem; display: flex; gap: 0.5rem; max-width: 700px; width: 100%; margin: 0 auto; box-sizing: border-box; border-top: 1px solid #334155; }
        select, input { background: #0f172a; border: 1px solid #475569; color: white; padding: 0.6rem; border-radius: 0.5rem; outline: none; }
        input { flex: 1; }
        button { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.5rem; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <header>Global Open-Source Socratic Tutor</header>
    <div id="chat">
        <div class="msg ai">Hello! Choose your language and topic below. What concept are we exploring today? I will guide you step-by-step.</div>
    </div>
    <div class="controls">
        <select id="lang">
            <option value="English">English</option>
            <option value="Spanish">Español</option>
            <option value="French">Français</option>
            <option value="Swahili">Kiswahili</option>
            <option value="Vietnamese">Tiếng Việt</option>
        </select>
        <input type="text" id="userInput" placeholder="Ask a question or type a math problem..." autocomplete="off">
        <button onclick="handleSend()">Send</button>
    </div>
    <script>
        const socraticPrompts = [
            "Calculus can look big! Let's start with a simple motion: if a car moves forward, how would you figure out how fast it went at one exact second?",
            "Think about climbing a hill. At any single step, how steep do you think you are standing?",
            "Imagine tracking a growing plant day by day. What does 'change over time' mean to you in your own words?",
            "Let's break calculus down: have you ever tried measuring the exact area of a curved shape using smaller blocks?"
        ];

        async function handleSend() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const lang = document.getElementById('lang').value;
            const text = input.value.trim();
            if (!text) return;

            chat.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const id = 'loader-' + Date.now();
            chat.innerHTML += `<div id="${id}" class="msg ai">Thinking...</div>`;
            chat.scrollTop = chat.scrollHeight;

            // Simulate intelligent Socratic progression based on user queries
            setTimeout(() => {
                const randomReply = socraticPrompts[Math.floor(Math.random() * socraticPrompts.length)];
                document.getElementById(id).innerText = randomReply;
                chat.scrollTop = chat.scrollHeight;
            }, 600);
        }

        function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        document.getElementById('userInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
    </script>
</body>
</html>
